spring.datasource.url=jdbc:postgresql://${DB_HOST:dev-db}:${DB_PORT:5432}/${DB_NAME:gymcrm}
spring.datasource.username=${DB_USERNAME:gymcrm}
spring.datasource.password=${DB_PASSWORD:gymcrm}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

logging.level.com.gym.crm=DEBUG