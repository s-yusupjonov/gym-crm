spring.application.name=gym-crm
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.servlet.context-path=/gym-crm

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:th1s-is-a-default-development-only-secret-key-please-override-in-prod}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

internal-auth.secret=${INTERNAL_JWT_SECRET:th1s-is-a-shared-dev-only-internal-secret-override-in-prod}
internal-auth.expiration-ms=${INTERNAL_JWT_EXPIRATION_MS:60000}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}

resilience4j.circuitbreaker.instances.trainerWorkloadService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.trainerWorkloadService.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerWorkloadService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerWorkloadService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerWorkloadService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.trainerWorkloadService.permitted-number-of-calls-in-half-open-state=3

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.metrics.tags.application=${spring.application.name}