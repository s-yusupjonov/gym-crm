spring.application.name=gym-crm
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/gym-crm

spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET:th1s-is-a-default-development-only-secret-key-please-override-in-prod}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.jms.template.delivery-mode=persistent

activemq.queue.workload-events=${WORKLOAD_EVENTS_QUEUE:workload.events.queue}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.metrics.tags.application=${spring.application.name}