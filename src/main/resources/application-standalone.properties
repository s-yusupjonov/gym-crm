# "standalone" profile: run gym-crm in Docker with ALL external integrations disabled
#   - database : in-memory H2 (no PostgreSQL)
#   - queue    : ActiveMQ/JMS auto-configuration excluded, NoOpWorkloadClient is used instead
#   - registry : Eureka client disabled (no discovery-service)
# Activate with:  -e SPRING_PROFILES_ACTIVE=standalone
spring.datasource.url=jdbc:h2:mem:gymcrm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jms.activemq.ActiveMQAutoConfiguration,\
  org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration
management.health.jms.enabled=false

logging.level.com.gym.crm=DEBUG
management.endpoint.health.show-details=always
