spring.datasource.url=jdbc:h2:mem:gymcrm-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Eureka registration for tests - no discovery-service is running.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# In-JVM ActiveMQ broker so component tests don't need a real broker/Docker.
spring.activemq.broker-url=vm://localhost?broker.persistent=false

logging.level.com.gym.crm=WARN