services:
  postgres:
    image: postgres:16
    container_name: gym-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm
    ports:
      - "5433:5432"
    volumes:
      - gym-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm -d gymcrm"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: gym-crm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the Docker network Postgres is reachable at its service name "postgres" on its
      # internal port 5432, so the "dev" profile's host/port defaults are overridden here.
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: gymcrm
      DB_USERNAME: gymcrm
      DB_PASSWORD: gymcrm
    ports:
      - "8080:8080"

volumes:
  gym-crm-pgdata: