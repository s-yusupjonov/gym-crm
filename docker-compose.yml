services:
  postgres:
    image: postgres:16
    container_name: gym-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm
    ports:
      - "5433:5432"
    volumes:
      - gym-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm -d gymcrm"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: gym-crm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Overrides application.properties' db.url (which assumes Tomcat runs on the host,
      # talking to Postgres via the 5433 host-mapped port). Inside the Docker network,
      # Postgres is reachable at its service name "postgres" on its internal port 5432.
      # Spring's PropertySourcesPlaceholderConfigurer resolves system properties before
      # the classpath properties file, so -D flags here win without touching any Java code.
      JAVA_OPTS: >-
        -Ddb.url=jdbc:postgresql://postgres:5432/gymcrm
        -Ddb.username=gymcrm
        -Ddb.password=gymcrm
    ports:
      - "8080:8080"

volumes:
  gym-crm-pgdata: