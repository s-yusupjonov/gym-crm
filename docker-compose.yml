# gym-crm only: PostgreSQL + ActiveMQ + the app (dev profile), no Eureka / workload service.
# For the whole system use ../docker-compose.full-stack.yml instead (same container names - don't run both).
services:
  postgres:
    image: postgres:16
    container_name: gym-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm
      POSTGRES_PASSWORD: gymcrm
    ports:
      - "5433:5432"
    volumes:
      - gym-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm -d gymcrm"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - gym-net

  activemq:
    image: apache/activemq-classic:6.1.8
    container_name: gym-crm-activemq
    restart: unless-stopped
    environment:
      ACTIVEMQ_CONNECTION_USER: admin
      ACTIVEMQ_CONNECTION_PASSWORD: admin
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    ports:
      - "61616:61616" # OpenWire
      - "8161:8161"   # Web console (http://localhost:8161, admin/admin)
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/61616'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - gym-net

  app:
    build: .
    container_name: gym-crm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    environment:
      # Inside the Docker network Postgres/ActiveMQ are reachable at their service names on their
      # internal ports, so the "dev" profile's host/port defaults are overridden here.
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: gymcrm
      DB_USERNAME: gymcrm
      DB_PASSWORD: gymcrm
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
      # No discovery-service in this compose file
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
    ports:
      - "8080:8080"
    networks:
      - gym-net

networks:
  gym-net:
    name: gym-net
    driver: bridge

volumes:
  gym-crm-pgdata:
